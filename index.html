<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giuseppe Sandrini - Apps</title>
  <meta name="description" content="A collection of small web apps." />
  <meta property="og:title" content="Giuseppe Sandrini - Apps" />
  <meta property="og:description" content="A collection of small web apps." />
  <meta property="og:type" content="website" />
  <script>
    /* Apply saved (or system) language and theme before first paint, so there is no flash */
    (function () {
      var lang, theme;
      try {
        lang = localStorage.getItem('dummy-text-language');
        theme = localStorage.getItem('dummy-text-theme');
      } catch (_) {}
      if (lang !== 'it' && lang !== 'en') {
        lang = (navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en';
      }
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.lang = lang;
      root.dataset.theme = theme;
      if (theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').content = '#181a1f';
      }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/tailwind.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
  <script defer src="assets/js/alpine.min.js"></script>
</head>

<body class="min-h-screen" x-data="showcase()" x-cloak @keydown.escape.window="closeLightbox()">
  <div id="lightbox" @click="closeLightbox()" x-show="showLightbox">
    <button id="lightbox-close" @click.stop="closeLightbox()" type="button" :aria-label="t.closeLightbox" :title="t.closeLightbox">&times;</button>
    <img id="lightbox-img" :src="lightboxSrc" :alt="lightboxAlt" />
  </div>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <h1 class="page-title">Giuseppe Sandrini</h1>
        <p class="page-subtitle text-xs text-muted">Small apps · Open source</p>
      </div>
      <div class="header-controls">
        <button type="button" @click="toggleLang()" class="icon-btn text-xs"
          :aria-label="t.toggleLanguage" :title="t.toggleLanguage"
          x-text="lang === 'it' ? 'EN' : 'IT'"></button>
        <button type="button" @click="toggleTheme()" class="icon-btn"
          :aria-label="t[theme === 'dark' ? 'activateLightTheme' : 'activateDarkTheme']"
          :title="t[theme === 'dark' ? 'activateLightTheme' : 'activateDarkTheme']">
          <span x-html="theme === 'dark' ? iconSun : iconMoon" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <div class="tab-list">
      <button @click="activeTab = 'about'" class="tab-btn" :class="{ active: activeTab === 'about' }"
        x-text="t.tabAbout"></button>
      <button @click="activeTab = 'usage'" class="tab-btn" :class="{ active: activeTab === 'usage' }"
        x-text="t.tabUsage"></button>
    </div>
    <div class="info-card app-card">
      <div x-show="activeTab === 'about'" class="info-panel text-xs text-muted">
        <p x-text="t.aboutIntro"></p>
        <p x-text="t.aboutTypes"></p>
        <p><span class="badge-wails"><span x-html="iconWails"></span>WAILS</span></p>
        <p x-text="t.aboutWails"></p>
        <p><span class="badge-pwa"><span x-html="iconPwa"></span>PWA</span></p>
        <p x-text="t.aboutPwa"></p>
        <p class="font-semibold pt-1" x-text="t.aboutOrigin"></p>
        <p x-text="t.aboutOrigin1"></p>
        <p x-text="t.aboutOrigin2"></p>
        <p x-text="t.aboutOrigin3"></p>
      </div>
      <div x-show="activeTab === 'usage'" class="info-panel text-xs text-muted">
        <p><span class="badge-wails"><span x-html="iconWails"></span>WAILS</span></p>
        <ol class="list-decimal ml-5 space-y-1">
          <li x-text="t.wailsStep1"></li>
          <li x-text="t.wailsStep2"></li>
          <li x-text="t.wailsStep3"></li>
        </ol>
        <p><span class="badge-pwa"><span x-html="iconPwa"></span>PWA</span></p>
        <ol class="list-decimal ml-5 space-y-1">
          <li x-text="t.browserStep1"></li>
          <li x-text="t.browserStep2"></li>
          <li x-text="t.browserStep3"></li>
        </ol>
        <p class="pt-1" x-text="t.readmeNote"></p>
      </div>
    </div>
    <div class="app-grid">
      <template x-for="app in apps" :key="app.id">
        <div class="app-card app-card-grid">
          <div class="screenshot-area">
            <img :src="app.screenshot" :alt="app.name" class="w-full object-contain object-top" x-show="app.screenshot"
              @error="$el.style.display='none'" @click="app.screenshot && openLightbox(app.screenshot, app.name)" />
            <div class="screenshot-placeholder text-xs text-muted"
              x-show="!app.screenshot" x-text="t.screenshotPlaceholder"></div>
          </div>
          <div class="card-body">
            <div class="card-header">
              <span class="app-title text-sm font-medium" x-text="app.name"></span>
              <span class="badge" x-text="t.appTags[app.tag]"></span>
              <span x-show="app.pwa" class="badge-pwa"><span x-html="iconPwa"></span>PWA</span>
              <span x-show="app.wails" class="badge-wails"><span x-html="iconWails"></span>WAILS</span>
            </div>
            <p class="app-description text-xs text-muted" x-text="app.desc[lang]"></p>
            <div class="card-actions">
              <a x-show="app.demoUrl" :href="app.demoUrl" target="_blank" rel="noopener"
                class="btn-primary text-xs font-medium">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20" />
                </svg>
                <span x-text="t.btnDemo"></span>
              </a>
              <a :href="app.repoUrl" target="_blank" rel="noopener"
                class="btn-secondary text-xs">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                </svg>
                GitHub
              </a>
            </div>
          </div>
        </div>
      </template>
    </div>
    <footer class="page-footer divider text-xs text-muted">
      <span x-text="t.license"></span>
      <span x-text="t.madeWith"></span>
    </footer>
  </div>
  <script src="assets/js/app.js"></script>
</body>

</html>
